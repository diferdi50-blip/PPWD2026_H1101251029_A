<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Studi Kasus jQuery</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            font-family: Arial;
            background: #bcd9ff;
            color: #173d6b;
            margin: 0;
            padding: 25px
        }

        .container {
            max-width: 950px;
            margin: auto
        }

        .card {
            background: white;
            padding: 22px;
            margin: 15px 0;
            border-radius: 15px;
            box-shadow: 0 4px 15px #d5deea
        }

        h1 {
            text-align: center
        }

        h2 {
            margin-top: 0
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px
        }

        .product {
            border: 1px solid #d5dfed;
            padding: 15px;
            border-radius: 10px
        }

        .product h3 {
            margin: 0 0 8px
        }

        button {
            border: 0;
            background: #28569b;
            color: white;
            padding: 9px 15px;
            border-radius: 7px;
            cursor: pointer;
            margin: 3px
        }

        button:hover {
            background: #1d4074
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #ddd;
            padding: 10px 0
        }

        .total {
            text-align: right;
            font-size: 18px
        }

        .discount {
            color: #d62828
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: #0008;
            align-items: center;
            justify-content: center
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 430px;
            padding: 25px;
            border-radius: 15px
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 5px 0 12px;
            border: 1px solid #bbc9da;
            border-radius: 7px
        }

        textarea {
            height: 80px;
            resize: none
        }

        .error {
            display: none;
            color: #d62828;
            font-size: 13px
        }

        .history {
            border-bottom: 1px solid #ddd;
            padding: 8px 0
        }

        @media(max-width:700px) {
            .products {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🛒 Toko Online</h1>

        <div class="card">
            <h2>Daftar Produk</h2>
            <div class="products">
                <div class="product">
                    <h3>Laptop</h3>
                    <p>Rp 80.000</p>
                    <button onclick="add('Laptop',80000)">Tambah</button>
                </div>
                <div class="product">
                    <h3>Keyboard</h3>
                    <p>Rp 150.000</p>
                    <button onclick="add('Keyboard',150000)">Tambah</button>
                </div>
                <div class="product">
                    <h3>Mouse</h3>
                    <p>Rp 75.000</p>
                    <button onclick="add('Mouse',75000)">Tambah</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>🛒 Keranjang</h2>
            <div id="cart">Keranjang kosong.</div>
            <div class="total">
                <p>Total: <b id="cartTotal">Rp 0</b></p>
                <p id="discount" class="discount"></p>
                <button id="checkout">Checkout</button>
            </div>
        </div>

        <div class="card">
            <h2>📋 Riwayat Pembelian</h2>
            <div id="history">Belum ada riwayat.</div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2>Data Pembeli</h2>
            <form id="buyerForm">
                <label>Nama</label>
                <input id="nama" placeholder="Nama lengkap">
                <div id="errNama" class="error">Nama wajib diisi.</div>

                <label>Alamat</label>
                <textarea id="alamat" placeholder="Alamat lengkap"></textarea>
                <div id="errAlamat" class="error">Alamat wajib diisi.</div>

                <label>No. HP</label>
                <input id="hp" placeholder="08xxxxxxxxxx">
                <div id="errHp" class="error">No. HP tidak valid.</div>

                <button type="submit">Konfirmasi</button>
                <button type="button" id="close">Batal</button>
            </form>
        </div>
    </div>

    <script>
        let cart = [];

        /* Tambah produk */
        function add(nama, harga) {
            let item = cart.find(x => x.nama === nama);
            item ? item.qty++ : cart.push({ nama, harga, qty: 1 });
            updateCartUI();
        }

        /* Tampilkan keranjang + Latihan 1 */
        function updateCartUI() {
            let html = '', total = 0, qty = 0;

            cart.forEach((x, i) => {
                let sub = x.harga * x.qty;
                total += sub; qty += x.qty;
                html += `<div class="cart-item">
        <span>${x.nama} x${x.qty}</span>
        <span>Rp ${sub.toLocaleString('id-ID')}
        <button onclick="removeItem(${i})">Hapus</button></span></div>`;
            });

            let awal = total, diskon = 0;

            if (total > 100000) {
                diskon = total * 0.1;
                total -= diskon;
                $('#discount').html(`Diskon 10%: -Rp ${diskon.toLocaleString('id-ID')}`);
            } else $('#discount').html('');

            $('#cart').html(html || 'Keranjang kosong.');
            $('#cartTotal').html(`Rp ${total.toLocaleString('id-ID')}`);
        }

        function removeItem(i) {
            cart.splice(i, 1);
            updateCartUI();
        }

        /* Latihan 2: localStorage */
        function simpanRiwayat(total, qty) {
            let riwayat = JSON.parse(localStorage.getItem('riwayat')) || [];
            riwayat.push({ tanggal: new Date().toISOString(), total, qty });
            localStorage.setItem('riwayat', JSON.stringify(riwayat));
        }

        function tampilRiwayat() {
            let data = JSON.parse(localStorage.getItem('riwayat')) || [];
            if (!data.length) return $('#history').html('Belum ada riwayat.');

            $('#history').html(data.map(x => `
    <div class="history">
    📅 ${new Date(x.tanggal).toLocaleString('id-ID')}<br>
    Barang: ${x.qty} | Total: <b>Rp ${x.total.toLocaleString('id-ID')}</b>
    </div>`).join(''));
        }

        /* Checkout */
        $('#checkout').click(function () {
            if (!cart.length) return alert('Keranjang masih kosong!');
            $('#modal').css('display', 'flex');
        });

        $('#close').click(() => $('#modal').hide());

        /* Latihan 3: Validasi pembeli */
        $('#buyerForm').submit(function (e) {
            e.preventDefault();

            let nama = $('#nama').val().trim(),
                alamat = $('#alamat').val().trim(),
                hp = $('#hp').val().trim(),
                valid = true;

            $('#errNama').toggle(!nama);
            $('#errAlamat').toggle(!alamat);
            $('#errHp').toggle(!/^08[0-9]{8,12}$/.test(hp));

            if (!nama || !alamat || !/^08[0-9]{8,12}$/.test(hp)) return;

            let total = cart.reduce((s, x) => s + x.harga * x.qty, 0);
            if (total > 100000) total -= total * .1;

            let qty = cart.reduce((s, x) => s + x.qty, 0);

            simpanRiwayat(total, qty);
            alert(`Checkout berhasil!\nNama: ${nama}\nTotal: Rp ${total.toLocaleString('id-ID')}`);

            cart = [];
            updateCartUI();
            tampilRiwayat();
            $('#modal').hide();
            this.reset();
        });

        $(document).ready(function () {
            updateCartUI();
            tampilRiwayat();
        });
    </script>
</body>

</html>
